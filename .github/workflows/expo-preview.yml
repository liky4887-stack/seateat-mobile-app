name: Expo Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version
      
      - name: Install dependencies
        run: |
          pnpm install --force --no-frozen-lockfile --ignore-scripts
      
      - name: Setup pnpm global bin
        run: pnpm setup
      
      - name: Install expo globally
        run: pnpm add -g expo-cli
      
      - name: Expo Preview Action
        uses: expo/expo-preview-action@v1.2.2
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
