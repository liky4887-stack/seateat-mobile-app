name: Expo Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version
      
      - name: Install dependencies
        run: |
          pnpm install --force --no-frozen-lockfile --ignore-scripts
      
      - name: Add pnpm to PATH
        run: |
          echo "$HOME/.local/share/pnpm/bin" >> $GITHUB_PATH
          ln -sf "$(pnpm bin)/expo" /usr/local/bin/expo
          which expo
          expo --version
      
      - name: Expo Preview
        run: |
          npx expo preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
